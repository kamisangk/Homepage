<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="kamisamak 的个人主页 — Java / Scala / Python 后端开发者">
<title>kamisamak — KAMISAMAK.HUB</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ctext x='16' y='23' font-family='monospace' font-size='15' fill='%23c0fe04' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;
  --ink:#ededed;
  --dim:#8a8a8a;
  --faint:#3a3a3a;
  --green:#c0fe04;
  --green-dim:#5a7a04;
  --pink:#ff0054;
  --panel:rgba(5,5,5,.82);
  --sel:rgba(192,254,4,.3);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Geist Mono','SF Mono',Menlo,Consolas,'Noto Sans SC',ui-monospace,monospace;
  font-size:15px;
  line-height:1.7;
  overflow:hidden;
  position:relative;
}
::selection{background:var(--sel)}

/* ============ 背景字符场 ============ */
#debris{
  position:fixed;inset:0;
  z-index:0;
  display:block;
}

/* ============ CRT 效果 ============ */
.crt-lines{
  position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(0deg,
    rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
    rgba(0,0,0,.22) 3px, rgba(0,0,0,.22) 4px);
}
.crt-glow{
  position:fixed;inset:0;pointer-events:none;z-index:49;
  background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
}
@keyframes flicker{0%,100%{opacity:1}96%{opacity:1}97%{opacity:.85}98%{opacity:1}}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:48;
  background:rgba(192,254,4,.015);
  animation:flicker 7s infinite;
}

/* ============ 四周角标 ============ */
.corner{
  position:fixed;z-index:5;
  color:var(--green);
  font-size:12.5px;
  letter-spacing:.5px;
  user-select:none;
  white-space:nowrap;
}
.corner.dim{color:var(--green-dim)}
.corner.tl{top:16px;left:20px}
.corner.tr{top:16px;right:20px}
.corner.bl{bottom:16px;left:20px}
.corner.br{bottom:16px;right:20px}

/* ============ 终端面板 ============ */
.panel{
  position:absolute;
  z-index:10;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:min(900px,94vw);
  height:min(632px,80vh);
  border:1px solid var(--green);
  display:flex;flex-direction:column;
  background:var(--panel);
}
.p-head{
  flex:none;
  display:flex;align-items:center;
  height:30px;
  padding:0 14px;
  border-bottom:1px solid var(--green-dim);
  color:var(--green);
  font-size:13px;
  letter-spacing:1px;
  user-select:none;
}
.p-head .op{
  margin-left:auto;
  color:var(--green);
  opacity:.75;
}
.p-body{
  flex:1;
  overflow-y:auto;
  padding:14px 18px;
  scrollbar-width:thin;scrollbar-color:#222 transparent;
}
.p-body::-webkit-scrollbar{width:8px}
.p-body::-webkit-scrollbar-thumb{background:#222}

/* boot 横幅 */
.boot{white-space:pre-wrap;margin-bottom:10px}
.boot .b-name{color:var(--ink);font-weight:700}
.boot .b-dim{color:var(--dim)}
.boot .b-ok{color:var(--green)}

/* 输出 */
.out{white-space:pre-wrap;word-break:break-word}
.cmd-echo .op{color:var(--green)}
.cmd-echo .path{color:var(--pink)}
.hl-cmd{color:var(--green)}
.hl-ok{color:var(--green)}
.hl-dim{color:var(--dim)}
.hl-faint{color:var(--faint)}
.hl-warn{color:var(--pink)}
.hl-err{color:var(--pink)}
.hl-user{color:var(--pink)}
a{color:var(--green);text-decoration:none;border-bottom:1px dotted var(--green-dim)}
a:hover{border-bottom-style:solid}

/* 输入行 */
.input-line{display:flex;align-items:baseline;gap:0;padding-top:2px}
.prompt{white-space:pre;flex:none}
.prompt .op{color:var(--green)}
.prompt .path{color:var(--pink)}
.prompt .dollar{color:var(--dim)}
#cmdInput{
  flex:1;
  background:transparent;border:none;outline:none;
  font:inherit;color:var(--ink);
  caret-color:var(--green);
  min-width:0;
  padding-left:8px;
}

/* 页脚：计时器 + 标语 */
.p-foot{
  flex:none;
  display:flex;align-items:center;
  height:30px;
  border-top:1px solid var(--green-dim);
  padding:0 14px;
  font-size:12.5px;
  user-select:none;
  overflow:hidden;
}
.ticker{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  color:var(--green-dim);
  letter-spacing:1px;
  mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
}
.ticker b{color:var(--pink);font-weight:400}
.uptime{
  flex:none;
  margin-left:16px;
  color:var(--green);
  letter-spacing:1px;
}

@media (max-width:640px){
  body{font-size:13.5px}
  .corner{display:none}
  .p-body{padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important}
}
</style>
</head>
<body>
<canvas id="debris" aria-hidden="true"></canvas>
<div class="crt-glow" aria-hidden="true"></div>
<div class="crt-lines" aria-hidden="true"></div>

<span class="corner tl" aria-hidden="true">Connected — Server 𝟶.4.5-23</span>
<span class="corner tr dim" aria-hidden="true">931.461.0348</span>
<span class="corner bl" aria-hidden="true">CAS.term/CyberAcme Systems, Inc.</span>
<span class="corner br dim" aria-hidden="true">&lt;931.461.60231.14.vt920&gt;</span>

<div class="panel">
  <div class="p-head" aria-hidden="true">
    <span class="name">KAMISAMAK/HUB</span>
    <span class="op">U-53A5</span>
  </div>

  <div class="p-body" id="term">
    <div class="boot" id="boot"></div>
    <div id="history"></div>

    <div class="input-line" id="inputLine">
      <span class="prompt"><span class="op">operator</span><span class="hl-dim">@</span><span class="path">kamisamak</span><span class="hl-dim">:/$</span></span>
      <input id="cmdInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="终端输入">
    </div>
  </div>

  <div class="p-foot" aria-hidden="true">
    <div class="ticker" id="ticker"></div>
    <span class="uptime">T+<span id="uptime">00:00:00</span></span>
  </div>
</div>

<script>
(function(){
  var termEl = document.getElementById('term');
  var historyEl = document.getElementById('history');
  var input = document.getElementById('cmdInput');

  var GITHUB_USER = 'kamisangk';
  var BLOG_URL = 'https://blog.kamisamak.com';
  var GITHUB_URL = 'https://github.com/kamisangk';

  var loadTime = Date.now();
  var cmdHistory = [];
  var histIdx = -1;
  var projectsCache = null;

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function scrollBottom(){ termEl.scrollTop = termEl.scrollHeight; }
  function print(html){
    var div = document.createElement('div');
    div.className = 'out';
    div.innerHTML = html;
    historyEl.appendChild(div);
  }
  function printRaw(text, cls){
    print('<span' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(text) + '</span>');
  }
  function echoCommand(cmd){
    print('<span class="cmd-echo"><span class="op">operator</span><span class="hl-dim">@</span><span class="path">kamisamak</span><span class="hl-dim">:/$</span> ' + esc(cmd) + '</span>');
  }
  function linkLine(label, url){
    return '- ' + esc(label) + ': <a href="' + url + '" target="_blank" rel="noopener">' + esc(url) + '</a>';
  }
  function openUrl(url){
    print(linkLine('click', url));
    try{ window.open(url, '_blank', 'noopener'); }catch(e){}
  }
  function pad(n){ return String(n).padStart(2,'0'); }

  /* ============ T+ 计时器 ============ */
  setInterval(function(){
    var s = Math.floor((Date.now() - loadTime) / 1000);
    var el = document.getElementById('uptime');
    if (el) el.textContent = pad(Math.floor(s/3600)) + ':' + pad(Math.floor(s%3600/60)) + ':' + pad(s%60);
  }, 1000);

  /* ============ 底部标语 ============ */
  var TICKER_ITEMS = [
    'JAVA RUNTIME <b>|</b> SCALA 3 <b>|</b> CP1252 RESISTANCE CELL',
    'BACKEND PROCESSING <b>|</b> NO WAITLIST <b>|</b> PERSONAL USE ONLY',
    'UNLICENSED BLOGGING <b>|</b> RAD-HARDENED STACK <b>|</b> EST. 2026',
    'MESH0 LINK UP <b>|</b> OPERATOR ACTIVE <b>|</b> SYSTEM NOMINAL'
  ];
  (function(){
    var el = document.getElementById('ticker');
    var i = 0;
    function rotate(){
      el.innerHTML = esc(TICKER_ITEMS[i].replace(/<[^>]+>/g,'')).replace(/\|/g,'<b>|</b>');
      i = (i + 1) % TICKER_ITEMS.length;
    }
    rotate();
    setInterval(rotate, 10000);
  })();

  /* ============ 启动横幅（打字机） ============ */
  var BOOT_LINES = [
    ['b-name', 'KAMISAMAK/HUB'],
    ['b-dim',  'UESC-UNIX kernel 15.92.0-UESC-secure'],
    ['b-dim',  'NET: mesh0: link up 34.782.0.1'],
    ['b-ok',   'init: system ready']
  ];
  (function(){
    var boot = document.getElementById('boot');
    var li = 0, ci = 0;
    var row = null;
    function step(){
      if (li >= BOOT_LINES.length){
        printRaw('输入 help 查看可用命令。', 'hl-dim');
        print('&nbsp;');
        scrollBottom();
        return;
      }
      if (!row){
        row = document.createElement('div');
        row.className = BOOT_LINES[li][0];
        boot.appendChild(row);
      }
      row.textContent = BOOT_LINES[li][1].slice(0, ++ci);
      if (ci >= BOOT_LINES[li][1].length){
        li++; ci = 0; row = null;
        setTimeout(step, 120);
      } else {
        setTimeout(step, 14 + Math.random() * 30);
      }
      scrollBottom();
    }
    step();
  })();

  /* ============ 背景字符球 ============ */
  (function(){
    var cv = document.getElementById('debris');
    var ctx = cv.getContext('2d');
    var W = 0, H = 0, CX = 0, CY = 0, R = 0;
    var POOL = 'abcdefghijklmnopqrstuvwxyz0123456789+-*/<>#$%&@!?';
    var N = 320;
    var pts = [];
    var rotY = 0, rotX = 0.35;
    var targetRotX = 0.35, targetRotY = 0;
    var mouse = {x: 0, y: 0};

    function resize(){
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      cv.style.width = W + 'px'; cv.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      CX = W / 2; CY = H / 2;
      R = Math.min(W, H) * 0.62;
    }

    function seed(){
      pts = [];
      for (var i = 0; i < N; i++){
        // 均匀分布球面
        var u = Math.random() * 2 - 1;
        var th = Math.random() * Math.PI * 2;
        var s = Math.sqrt(1 - u * u);
        var r = 0.85 + Math.random() * 0.3; // 球体厚度
        pts.push({
          x: s * Math.cos(th) * r,
          y: u * r,
          z: s * Math.sin(th) * r,
          ch: POOL[Math.floor(Math.random() * POOL.length)],
          size: 9 + Math.random() * 5,
          speed: 0.12 + Math.random() * 0.25,
          green: Math.random() < 0.8
        });
      }
    }

    var lastChSwap = 0;
    function frame(t){
      rotY += 0.0016;
      rotX += (targetRotX - rotX) * 0.02;
      targetRotY += (mouse.x - targetRotY) * 0.00008;

      ctx.clearRect(0, 0, W, H);
      var sinX = Math.sin(rotX), cosX = Math.cos(rotX);
      var yy = rotY + targetRotY;
      var sinY = Math.sin(yy), cosY = Math.cos(yy);

      if (t - lastChSwap > 2500){
        lastChSwap = t;
        var k = Math.floor(Math.random() * pts.length);
        pts[k].ch = POOL[Math.floor(Math.random() * POOL.length)];
      }

      for (var i = 0; i < N; i++){
        var p = pts[i];
        var x = p.x * cosY - p.z * sinY;
        var z = p.x * sinY + p.z * cosY;
        var y = p.y * cosX - z * sinX;
        z = p.y * sinX + z * cosX;
        var persp = 1.6 / (1.6 + z);
        var sx = CX + x * R * persp;
        var sy = CY + y * R * persp;
        var depth = (z + 1.3) / 2.6; // 0 远 ~ 1 近
        ctx.font = (p.size * persp) + 'px "Geist Mono",monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (p.green){
          ctx.fillStyle = 'rgba(192,254,4,' + (0.08 + depth * 0.5) + ')';
        } else {
          ctx.fillStyle = 'rgba(237,237,237,' + (0.05 + depth * 0.35) + ')';
        }
        ctx.fillText(p.ch, sx, sy);
      }
      requestAnimationFrame(frame);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('pointermove', function(e){ mouse.x = e.clientX - W/2; });
    resize();
    seed();
    requestAnimationFrame(frame);
  })();

  /* ============ 命令表 ============ */
  var HELP_LINES = [
    ['help',      '显示本帮助'],
    ['about',     '关于操作员'],
    ['skills',    '技术栈'],
    ['projects',  '列出 GitHub 上的公开项目（联网获取）'],
    ['blog',      '我的博客'],
    ['github',    '我的 GitHub 主页'],
    ['socials',   '所有链接'],
    ['ident',     '显示主机身份'],
    ['status',    '系统状态'],
    ['neofetch',  '系统信息卡片'],
    ['date',      '当前时间'],
    ['echo',      '输出你输入的内容，如 echo hi'],
    ['history',   '查看历史命令'],
    ['clear',     '清屏']
  ];

  var commands = {
    help: function(){
      print('<span class="hl-ok">available commands:</span>');
      HELP_LINES.forEach(function(l){
        print('  <span class="hl-cmd">' + l[0].padEnd(10,' ').replace(/ /g,'&nbsp;') + '</span><span class="hl-dim">' + esc(l[1]) + '</span>');
      });
      print('<span class="hl-dim">提示：Tab 补全命令，↑↓ 翻阅历史。</span>');
    },

    about: function(){
      print('<span class="hl-user">kamisamak</span>');
      print('日常用 <span class="hl-cmd">Java</span> / <span class="hl-cmd">Scala</span> / <span class="hl-cmd">Python</span> 写后端。');
      print('偶尔写写博客，记录踩坑与折腾的过程。');
      print(linkLine('Blog', BLOG_URL));
      print(linkLine('GitHub', GITHUB_URL));
    },

    whoami: function(){ printRaw('operator: kamisamak', 'hl-user'); },

    ident: function(){
      printRaw('hostname: kamisam-hub', 'hl-dim');
      printRaw('kernel: 15.92.0-UESC-secure', 'hl-dim');
      printRaw('operator: active session', 'hl-dim');
    },

    status: function(){
      var s = Math.floor((Date.now() - loadTime) / 1000);
      printRaw('system: online', 'hl-ok');
      printRaw('uptime: ' + Math.floor(s/60) + 'm ' + (s%60) + 's', 'hl-dim');
      printRaw('load: 0.04 0.02 0.01', 'hl-dim');
      printRaw('mesh0: up', 'hl-dim');
    },

    scan: function(){
      printRaw('scanning...', 'hl-dim');
      setTimeout(function(){
        printRaw('filesystem: ok', 'hl-dim');
        printRaw('network: mesh0 up (34.782.0.1)', 'hl-dim');
        printRaw('services: jvm sshd cron', 'hl-dim');
        printRaw('operator: 1 reachable', 'hl-ok');
        scrollBottom();
      }, 600);
    },

    skills: function(){
      print('- 语言: <span class="hl-cmd">Java</span> / <span class="hl-cmd">Scala</span> / <span class="hl-cmd">Python</span>');
      print('- 方向: <span class="hl-cmd">后端开发</span>');
      print('<span class="hl-dim">其余技能栈：长期施工中 …</span>');
    },

    blog: function(){ openUrl(BLOG_URL); },
    github: function(){ openUrl(GITHUB_URL); },

    socials: function(){
      print(linkLine('GitHub', GITHUB_URL));
      print(linkLine('Blog', BLOG_URL));
      print('<span class="hl-dim">其他平台：待补充</span>');
    },

    projects: function(){
      if (projectsCache){ renderProjects(projectsCache); return; }
      print('<span class="hl-dim">正在从 GitHub 拉取项目 ...</span>');
      fetch('https://api.github.com/users/' + GITHUB_USER + '/repos?sort=updated&per_page=8')
        .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
        .then(function(repos){
          var list = repos.filter(function(x){ return !x.fork; });
          if (!list.length) list = repos;
          projectsCache = list;
          renderProjects(list);
        })
        .catch(function(){
          print('<span class="hl-err">GitHub 暂时联系不上，请稍后再试。</span>');
        });
    },

    date: function(){
      var d = new Date();
      var WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
      printRaw(d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate())
        + ' ' + WEEK[d.getDay()] + ' '
        + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()));
    },

    echo: function(args){ print(args.length ? esc(args.join(' ')) : '&nbsp;'); },

    history: function(){
      if (!cmdHistory.length){ print('<span class="hl-dim">还没有输入过命令。</span>'); return; }
      cmdHistory.forEach(function(c, i){
        print('<span class="hl-faint">' + String(i + 1).padStart(3,' ').replace(/ /g,'&nbsp;') + '</span>  ' + esc(c));
      });
    },

    clear: function(){
      historyEl.innerHTML = '';
      var boot = document.getElementById('boot');
      if (boot) boot.innerHTML = '';
    },

    neofetch: function(){
      var up = Math.floor((Date.now() - loadTime) / 1000);
      var upStr = up < 60 ? up + ' 秒'
        : up < 3600 ? Math.floor(up/60) + ' 分 ' + (up%60) + ' 秒'
        : Math.floor(up/3600) + ' 时 ' + Math.floor(up%3600/60) + ' 分';
      var art = [
        '   __ __  ___ ___  ',
        '  |  |  || _ | __| ',
        '  |  |  ||   | _|  ',
        '  |_____||_|_|___| ',
        '   KAMISAMAK / HUB  '
      ];
      var info = [
        ['<span class="hl-user">kamisamak</span>@<span class="hl-user">hub</span>', null],
        ['─────────────────────────', null],
        ['OS: UESC-UNIX 15.92.0 (web x86_64)', null],
        ['Shell: kamish 1.0', null],
        ['Uptime: ' + upStr, null],
        ['Languages: Java, Scala, Python', null],
        ['Host: <a href="' + GITHUB_URL + '" target="_blank" rel="noopener">GitHub Pages</a>', null],
        ['Display: CRT mono-green', null]
      ];
      var rows = Math.max(art.length, info.length);
      for (var i = 0; i < rows; i++){
        var a = art[i] || ' '.repeat(19);
        var b = info[i] ? (info[i][0]) : '';
        print('<span class="hl-cmd">' + esc(a) + '</span>  ' + b);
      }
    },

    sudo: function(){ print('<span class="hl-err">operator is not in the sudoers file. This incident will be reported.</span>'); },
    exit: function(){ print('<span class="hl-warn">没有出口。你还是输入 help 看看点什么吧。</span>'); },
    vim: function(){ print('<span class="hl-warn">此处无处可退，:q! 也不行。</span>'); },
    ls: function(){ print('<span class="hl-dim">这里没有文件系统，试试 projects 或 about。</span>'); },
    hello: function(){ printRaw('Hello! 输入 help 看看我都会什么。', 'hl-ok'); },
    hi: function(){ return commands.hello(); }
  };

  function renderProjects(list){
    if (!list.length){ print('<span class="hl-dim">公开仓库为空。</span>'); return; }
    list.slice(0, 8).forEach(function(repo){
      var meta = [];
      if (repo.language) meta.push(repo.language);
      meta.push('★ ' + repo.stargazers_count);
      var desc = repo.description || '暂无简介';
      print('  <a href="' + repo.html_url + '" target="_blank" rel="noopener">' + esc(repo.name) + '</a> <span class="hl-dim">[' + esc(meta.join(' · ')) + ']</span>');
      print('    <span class="hl-dim">' + esc(desc) + '</span>');
    });
    print('<span class="hl-dim">完整列表：' + GITHUB_URL + '</span>');
  }

  var aliases = {
    'whoami': 'whoami',
    'contact': 'socials',
    'links': 'socials',
    'repo': 'projects',
    'gh': 'github',
    'cls': 'clear'
  };

  function run(raw){
    var cmd = raw.trim();
    echoCommand(cmd);
    if (!cmd) return;

    cmdHistory.push(cmd);
    histIdx = cmdHistory.length;

    var parts = cmd.split(/\s+/);
    var name = parts[0].toLowerCase();
    var args = parts.slice(1);
    if (aliases[name]) name = aliases[name];

    if (commands[name]) commands[name](args);
    else print('<span class="hl-err">command not found: ' + esc(name) + '</span> — 输入 <span class="hl-cmd">help</span> 查看可用命令');
  }

  /* ============ 输入交互 ============ */
  input.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){
      var v = input.value;
      input.value = '';
      run(v);
      scrollBottom();
    } else if (e.key === 'ArrowUp'){
      e.preventDefault();
      if (histIdx > 0){ histIdx--; input.value = cmdHistory[histIdx] || ''; }
    } else if (e.key === 'ArrowDown'){
      e.preventDefault();
      if (histIdx < cmdHistory.length){
        histIdx++;
        input.value = cmdHistory[histIdx] || '';
      }
    } else if (e.key === 'Tab'){
      e.preventDefault();
      var cur = input.value.trim().toLowerCase();
      if (!cur) return;
      var pool = Object.keys(commands).concat(Object.keys(aliases));
      var uniq = pool.filter(function(c, i){ return pool.indexOf(c) === i; });
      var hits = uniq.filter(function(c){ return c.indexOf(cur) === 0; });
      if (hits.length === 1) input.value = hits[0];
      else if (hits.length > 1) printRaw(hits.join('   '), 'hl-dim');
    }
  });

  termEl.addEventListener('mouseup', function(){
    var sel = window.getSelection();
    if (sel && String(sel).length) return;
    input.focus({preventScroll:true});
  });
  input.focus();
})();
</script>
</body>
</html>
