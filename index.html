<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kamisamak 的主页</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
/* ============ 基础与变量：vereis.com 视觉风格 ============ */
:root{
  --bg:#f9f9fb;            /* 柔和米白 */
  --card:#ffffff;
  --line:#ececf1;          /* 极细浅灰边框 */
  --ink:#2e3440;           /* 深蓝黑文字 */
  --ink-soft:#6b7280;      /* 中性灰 */
  --ink-faint:#9ca3af;
  --accent:#f2a4b9;        /* 珊瑚粉 */
  --accent-deep:#e2558a;
  --accent-soft:#fceef2;
  --radius:16px;
  --shadow:0 6px 24px rgba(46,52,64,.06);
  --bounce:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Noto Sans SC',ui-sans-serif,system-ui,sans-serif;
  font-size:16px;color:var(--ink);background:var(--bg);
  min-height:100vh;overflow-x:hidden;
}
::selection{background:var(--accent-soft);color:var(--accent-deep)}

/* 云朵背景：扁平插画风格（vereis.com 标志元素） */
.clouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.cloud{position:absolute;opacity:.5;transition:filter 1s,opacity 1s}
.cloud svg{width:100%;height:100%;display:block}
.cloud-1{width:340px;height:170px;top:6%;left:-90px;animation:cloudDrift 60s linear infinite}
.cloud-2{width:260px;height:130px;top:16%;right:-70px;opacity:.35;animation:cloudDrift 80s linear infinite reverse}
.cloud-3{width:200px;height:100px;bottom:12%;left:4%;opacity:.3;animation:cloudDrift 90s linear infinite}
.cloud-4{width:150px;height:75px;bottom:28%;right:8%;opacity:.25;animation:cloudDrift 70s linear infinite reverse}
@keyframes cloudDrift{
  0%{transform:translateX(0)}
  50%{transform:translateX(60px)}
  100%{transform:translateX(0)}
}
.wrap{max-width:1040px;margin:0 auto;padding:0 32px;position:relative;z-index:1}

/* ============ 顶部导航 ============ */
nav{
  position:sticky;top:0;z-index:50;
  background:rgba(249,249,251,.82);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.nav-inner{max-width:1040px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:22px}
.logo{font-weight:900;font-size:20px;color:var(--ink);text-decoration:none;display:flex;align-items:center;gap:8px;letter-spacing:-.01em}
.logo .star{color:var(--accent-deep);display:inline-block;animation:spinSlow 8s linear infinite;font-size:16px}
.nav-links{display:flex;gap:2px;margin-left:auto}
.nav-links a{
  text-decoration:none;color:var(--ink-soft);font-weight:500;font-size:14px;
  padding:8px 16px;border-radius:12px;transition:.2s;
}
.nav-links a:hover{background:var(--accent-soft);color:var(--accent-deep)}
@keyframes spinSlow{to{transform:rotate(360deg)}}

/* ============ 主区域布局：vereis 式开放 Hero + 双栏内容区 ============ */
/* Hero：无边框卡片，左文案 + 右大幅立绘，直接叠在云朵背景上 */
.hero{
  position:relative;z-index:2;
  display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,46%);
  align-items:center;gap:12px;
  min-height:520px;padding:24px 0 30px;
}

.hero-text{
  display:flex;flex-direction:column;justify-content:center;gap:18px;
  min-width:0;padding:20px 0 20px 8px;
}

.hero-title{
  font-family:'ZCOOL KuaiLe','Noto Sans SC',cursive;
  font-size:clamp(2.6rem,5.4vw,4.6rem);
  font-weight:400;line-height:1.16;color:var(--ink);letter-spacing:.01em;
}
.hero-title .accent{color:var(--accent-deep);text-decoration:underline wavy var(--accent);text-decoration-thickness:3px;text-underline-offset:12px}
/* 第二行“我是 kamisamak~!!”强制不换行 */
.hero-title .line2{white-space:nowrap;font-size:.84em}
/* 技能标签 */
.skill-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.skill-tag{
  padding:7px 18px;border-radius:999px;font-weight:700;font-size:14px;
  background:var(--card);border:1.5px solid var(--line);color:var(--ink);
  box-shadow:var(--shadow);transition:.18s;
}
.skill-tag:hover{border-color:var(--accent);color:var(--accent-deep);transform:translateY(-2px)}
/* Let's connect + GitHub 图标 */
.connect-row{display:flex;align-items:center;gap:14px;margin-top:4px}
.connect-label{
  font-size:15px;font-weight:700;color:var(--ink-soft);letter-spacing:.01em;
}
.gh-link{
  display:inline-flex;align-items:center;justify-content:center;
  width:42px;height:42px;border-radius:12px;
  background:var(--card);border:1.5px solid var(--line);box-shadow:var(--shadow);
  color:var(--ink);transition:.18s;
}
.gh-link svg{width:22px;height:22px;fill:currentColor}
.gh-link:hover{color:#fff;background:#24292f;border-color:#24292f;transform:translateY(-2px);box-shadow:0 8px 20px rgba(36,41,47,.25)}

/* ---- 立绘区装饰：星星爱心漂浮 ---- */
.deco{position:absolute;pointer-events:none}
.deco span{position:absolute;display:block;color:var(--accent);font-size:20px;animation:floaty 3.4s ease-in-out infinite}
.deco .d1{top:14%;left:2%;animation-delay:.2s;color:var(--accent-deep)}
.deco .d2{top:24%;right:0;color:var(--accent);animation-delay:1.1s}
.deco .d3{bottom:28%;left:0;color:var(--accent);animation-delay:2s;font-size:16px}
.deco .d4{bottom:36%;right:2%;animation-delay:.6s;font-size:15px;color:var(--accent-deep)}

@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-13px) rotate(9deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,85,138,.4)}100%{box-shadow:0 0 0 10px rgba(226,85,138,0)}}

/* ============ 魔理沙立绘（静态图片，Hero 右侧大幅展示） ============ */
.girl-wrap{position:relative;display:flex;justify-content:center;align-items:flex-end;min-width:0}
#girlSvg{
  width:100%;max-width:460px;height:auto;object-fit:contain;
  overflow:visible;display:block;user-select:none;
  animation:bob 3.4s ease-in-out infinite;
  filter:drop-shadow(0 14px 22px rgba(46,52,64,.12));
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}

/* ============ 内容区：vereis 式双栏（左窄组件栏 + 右内容列） ============ */
.content{
  display:grid;grid-template-columns:280px minmax(0,1fr);
  gap:20px;align-items:start;padding:8px 0 0;
}
.sidebar{display:flex;flex-direction:column;gap:16px;position:sticky;top:76px}
.content-main{display:flex;flex-direction:column;gap:20px;min-width:0}
.widget{
  background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;box-shadow:var(--shadow);
}
.w-head{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--ink-faint);margin-bottom:12px;text-transform:uppercase}
.w-head .w-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.w-head .right{margin-left:auto;letter-spacing:.04em}

/* 本地时钟 */
.live-badge{display:inline-flex;align-items:center;gap:6px;color:var(--accent-deep)}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--accent-deep);animation:pulse 1.4s infinite}
.clock-num{
  font-size:40px;font-weight:900;line-height:1;color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:.01em;
}
.viewer-caption{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.6}

/* 数据统计 */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-cell{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat-cell .k{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-faint)}
.stat-cell .v{font-size:21px;font-weight:900;color:var(--ink);margin-top:2px}
.stat-cell .v small{font-size:12px;color:var(--accent-deep);font-weight:700}

/* 正在播放 */
.music-row{display:flex;align-items:center;gap:14px}
.music-cover{
  width:54px;height:54px;border-radius:14px;flex-shrink:0;object-fit:cover;
  background:var(--accent-soft);border:1.5px solid var(--line);
}
.music-meta{min-width:0;flex:1}
.music-link{color:inherit;text-decoration:none;display:flex;align-items:center;gap:14px;min-width:0;flex:1}
.music-title{
  font-weight:700;font-size:14px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.music-title.flip{animation:titleflip .5s ease}
@keyframes titleflip{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.music-artist{font-size:12px;color:var(--ink-soft);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music-link:hover .music-title{color:var(--accent-deep)}
/* 播放按钮 */
.music-play{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;cursor:pointer;
  border:1.5px solid var(--accent-deep);background:var(--card);color:var(--accent-deep);
  font-size:13px;line-height:1;transition:.18s;
  display:flex;align-items:center;justify-content:center;padding:0;
}
.music-play:hover{background:var(--accent-deep);color:#fff;transform:translateY(-2px)}
.music-play:active{transform:translateY(0)}
.music-progress{height:6px;border-radius:999px;background:var(--line);margin-top:12px;cursor:pointer;touch-action:none}
.music-fill{
  display:block;height:100%;width:0;border-radius:999px;position:relative;
  background:var(--accent);transition:width .25s linear;
}
/* 拖动小圆钮：hover / 拖动时出现 */
.music-fill::after{
  content:"";position:absolute;right:-6px;top:50%;width:14px;height:14px;border-radius:50%;
  background:#fff;border:2px solid var(--accent-deep);
  transform:translateY(-50%) scale(0);transition:transform .15s var(--bounce);
  box-shadow:0 2px 6px rgba(46,52,64,.15);
}
.music-progress:hover .music-fill::after,
.music-progress.dragging .music-fill::after{transform:translateY(-50%) scale(1)}
.music-progress.dragging .music-fill{transition:none}

/* GitHub 热力图（全宽区块，格子随容器自适应拉伸） */
.gh-section{padding:0}
.gh-heat{
  display:grid;grid-auto-flow:column;
  grid-template-rows:repeat(7,auto);grid-auto-columns:1fr;
  gap:3px;
}
.gh-cell{
  width:10px;height:10px;border-radius:3px;display:inline-block;
  background:var(--line);transition:transform .15s var(--bounce);
}
.gh-heat .gh-cell{width:auto;height:auto;aspect-ratio:1;border-radius:4px}
.gh-heat .gh-cell:hover{transform:scale(1.35);cursor:pointer}
.gh-cell.lv0{background:#ececf1}
.gh-cell.lv1{background:#fbd5e0}
.gh-cell.lv2{background:#f7b3c8}
.gh-cell.lv3{background:#f2a4b9}
.gh-cell.lv4{background:#e2558a}
.gh-legend{
  display:flex;align-items:center;gap:4px;margin-top:10px;
  font-size:11px;font-weight:500;color:var(--ink-faint);justify-content:flex-end;
}
.gh-legend .gh-cell:hover{transform:none;cursor:default}
.gh-legend span{margin:0 4px}

/* ============ 项目列表：紧凑行式（vereis Recent posts 风格） ============ */
.projects{padding:0}
.section-head{display:flex;align-items:baseline;gap:16px;margin-bottom:14px}
.section-head h2{font-size:22px;font-weight:900;color:var(--ink);letter-spacing:-.01em}
.section-head a{margin-left:auto;font-size:13.5px;font-weight:500;color:var(--accent-deep);text-decoration:none}
.section-head a:hover{text-decoration:underline}
.proj-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.proj-card{
  background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow);transition:.2s var(--bounce);
  text-decoration:none;color:var(--ink);display:block;
  padding:13px 18px;
}
.proj-card:hover{transform:translateY(-2px);border-color:#d9d9e0;box-shadow:0 8px 24px rgba(46,52,64,.09)}
.proj-line1{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap}
.proj-icon{width:34px;height:34px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.pi-1{background:#fceef2}.pi-2{background:#f0ecfa}.pi-3{background:#eaf6f0}
.proj-icon svg{width:18px;height:18px}
.proj-body{min-width:0;flex:1}
.proj-body h3{
  font-size:15px;font-weight:700;margin-bottom:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.proj-body h3 .arrow{color:var(--accent-deep);font-weight:900;opacity:0;transition:.15s;margin-left:4px;display:inline-block}
.proj-card:hover .arrow{opacity:1;transform:translateX(2px)}
.proj-body p{
  font-size:12.5px;line-height:1.6;color:var(--ink-soft);
  display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
}
.proj-meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex-shrink:0}
.tag{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink-soft);white-space:nowrap}

/* ============ 页脚 ============ */
footer{padding:34px 0 44px;text-align:center}
footer .hand{font-size:15px;font-weight:700;color:var(--ink)}
footer .sub{font-size:12.5px;color:var(--ink-faint);margin-top:6px}

/* ============ 响应式 ============ */
@media (max-width:880px){
  .hero{grid-template-columns:1fr;min-height:0;text-align:center;gap:0}
  .hero-text{align-items:center;padding:12px 0 6px}
  .skill-row{justify-content:center}
  .girl-wrap{margin-top:6px}
  #girlSvg{max-width:340px}
  .content{grid-template-columns:1fr}
  .sidebar{position:static;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
}
@media (max-width:640px){
  .nav-links{display:none}
  .proj-grid{grid-template-columns:1fr}
  .proj-meta{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<!-- 云朵背景：扁平插画风格 -->
<div class="clouds" aria-hidden="true">
  <div class="cloud cloud-1">

<!-- 顶部导航 -->
<nav>
  <div class="nav-inner">
    <a class="logo" href="#"><span class="star">✦</span>kamisamak 的主页</a>
    <div class="nav-links">
      <a href="#">首页</a>

</nav>

<main class="wrap">

  <!-- Hero：vereis 式开放布局（左文案 + 右大幅立绘，叠在云朵背景上） -->
  <section class="hero">
    <!-- 左：Hero 文案 -->
    <div class="hero-text">
      <h1 class="hero-title">哇哈~!!<br><span class="line2">我是 <span class="accent">kamisamak</span>~!!</span></h1>

      <div class="skill-row">
        <span class="skill-tag">Java</span>
        <span class="skill-tag">Scala</span>
        <span class="skill-tag">Python</span>
      </div>

      <div class="connect-row">
        <span class="connect-label">Let's connect</span>
        <a class="gh-link" href="https://github.com/kamisangk" target="_blank" rel="noopener" title="GitHub">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        </a>
      </div>

    </div>

    <!-- 右：魔理沙立绘（静态图片，本地生成一次后复用） -->
    <div class="girl-wrap">
      <!-- 开心漂浮装饰 -->
      <div class="deco" aria-hidden="true">

  <!-- 内容区：vereis 式双栏（左窄组件栏 + 右内容列） -->
  <div class="content">

    <!-- 左：实时组件栏 -->
    <aside class="sidebar">

      <!-- 本地时钟 -->
      <div class="widget">
        <div class="w-head">
          <span class="live-badge"><span class="live-dot"></span>实时</span>
          <span class="right" id="clockDate">--</span>
        </div>

        <p class="viewer-caption">你所在的本地时间</p>
      </div>

      <!-- 数据统计 -->
      <div class="widget">
        <div class="w-head"><span class="w-dot"></span>数据面板</div>
        <div class="stats-grid">
          <div class="stat-cell"><div class="k">年度贡献</div><div class="v" id="statContrib">--</div></div>
          <div class="stat-cell"><div class="k">公开仓库</div><div class="v" id="statRepos">--</div></div>
          <div class="stat-cell"><div class="k">累计 Star</div><div class="v" id="statStars">--</div></div>

        </div>
      </div>

      <!-- 正在播放：网易云歌单 -->
      <div class="widget music-widget" id="musicWidget">
        <div class="w-head"><span class="w-dot"></span>正在播放</div>
        <div class="music-row">
          <a class="music-link" href="https://music.163.com/m/playlist?id=93839563&creatorId=45441555" target="_blank" rel="noopener">
            <img class="music-cover" id="musicCover" alt="封面" src="https://api.injahow.cn/meting/?server=netease&type=pic&id=875211255709933">

              <div class="music-title" id="musicTitle">东方同人歌单 ♪</div>

        <div class="music-progress" id="musicBar"><i class="music-fill" id="musicFill"></i></div>
      </div>
    </aside>

    <!-- 右：内容列（热力图 + 项目） -->
    <div class="content-main">

      <!-- GitHub 热力图：最近 1 年贡献（拉取失败则不展示） -->
      <section class="gh-section" id="ghHeatWidget" hidden>
        <div class="widget">
          <div class="w-head">
            <span class="w-dot"></span>贡献热力图
            <span class="right" id="ghHeatTotal"></span>
          </div>
          <div class="gh-heat" id="ghHeat"></div>
          <div class="gh-legend">
            <span>少</span>
            <i class="gh-cell lv0"></i><i class="gh-cell lv1"></i><i class="gh-cell lv2"></i><i class="gh-cell lv3"></i><i class="gh-cell lv4"></i>
            <span>多</span>
          </div>
        </div>
      </section>

      <!-- 项目区：GitHub API 拉取成功才展示 -->
      <section class="projects" id="projects" hidden>
        <div class="section-head">
          <h2>近期项目</h2>
          <a href="https://github.com/kamisangk" target="_blank" rel="noopener">查看全部 →</a>
        </div>
        <div class="proj-grid" id="projGrid"></div>
      </section>
    </div>
  </div>
</main>

<footer>
  <div class="hand">© 2026 kamisamak — 用 ♡、抹茶与魔法制作</div>
</footer>

<script>
/* ============ 近期项目：从 GitHub 动态拉取（失败则整个区块不展示） ============ */
(function(){
  var grid = document.getElementById('projGrid');
  var section = document.getElementById('projects');
  if (!grid || !section || !window.fetch) return; // 拉取不了就保持隐藏

  // 简易转义，防止仓库简介里的特殊字符破坏结构
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  var covers = ['pi-1','pi-2','pi-3'];
  var icons = [
    '<svg viewBox="0 0 24 24" fill="none"><path d="M12 2 L14.4 8.6 L21 9.3 L16 13.9 L17.5 20.6 L12 17 L6.5 20.6 L8 13.9 L3 9.3 L9.6 8.6 Z" fill="#F2A4B9" stroke="#E2558A" stroke-width="1.4" stroke-linejoin="round"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none"><path d="M20 13.5 A8.5 8.5 0 1 1 10.5 4 A7 7 0 0 0 20 13.5 Z" fill="#B9A7E8" stroke="#9F7BE8" stroke-width="1.4" stroke-linejoin="round"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none"><path d="M12 20 C6 15 3 11.5 3 8.3 C3 5.9 4.9 4 7.3 4 C8.9 4 10.4 4.9 12 6.8 C13.6 4.9 15.1 4 16.7 4 C19.1 4 21 5.9 21 8.3 C21 11.5 18 15 12 20 Z" fill="#8ED4B4" stroke="#6BBE9A" stroke-width="1.4" stroke-linejoin="round"/></svg>'
  ];

  fetch('https://api.github.com/users/kamisangk/repos?sort=updated&per_page=6')
    .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .then(function(repos){
      if (!repos.length) return; // 没有公开仓库也保持隐藏
      grid.innerHTML = repos.map(function(repo, i){
        var desc = repo.description || '这个仓库还没有写简介，等待魔法补完~';
        var tags = '';
        if (repo.language) tags += '<span class="tag">' + esc(repo.language) + '</span>';
        tags += '<span class="tag">★ ' + repo.stargazers_count + '</span>';
        if (repo.fork) tags += '<span class="tag">fork</span>';
        return '<a class="proj-card" href="' + repo.html_url + '" target="_blank" rel="noopener">'
             + '<div class="proj-line1">'
             + '<div class="proj-icon ' + covers[i % 3] + '">' + icons[i % 3] + '</div>'
             + '<div class="proj-body"><h3>' + esc(repo.name) + '<span class="arrow">→</span></h3>'
             + '<p>' + esc(desc) + '</p></div>'
             + '<div class="proj-meta">' + tags + '</div>'
             + '</div></a>';
      }).join('');
      section.hidden = false; // 数据就绪，展示整个区块
    })
    .catch(function(){ /* 网络不佳或触发限流：整个区块不展示 */ });
})();

/* ============ GitHub 热力图：最近 1 年贡献（失败则不展示） ============ */
(function(){
  var widget = document.getElementById('ghHeatWidget');
  var heat = document.getElementById('ghHeat');
  var totalEl = document.getElementById('ghHeatTotal');
  if (!widget || !heat || !window.fetch) return;

  // 按天数算强度分档（1 / 2-3 / 4-6 / 7+）
  function level(n){
    if (n <= 0) return 0;
    if (n === 1) return 1;
    if (n <= 3) return 2;
    if (n <= 6) return 3;
    return 4;
  }

  // jogruber 贡献 API：返回最近一年每天的贡献数（含真实 contribution 统计）
  fetch('https://github-contributions-api.jogruber.de/v4/kamisangk?y=last')
    .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .then(function(data){
      var days = data.contributions || [];
      if (!days.length) return; // 没有数据：保持隐藏

      var total = 0;
      var html = '';

      // 若首日不是周日，先补空位对齐周列（第一行 = 周日）
      var first = new Date(days[0].date + 'T00:00:00');
      for (var pad = 0; pad < first.getDay(); pad++){
        html += '<i class="gh-cell lv0" style="visibility:hidden"></i>';
      }

      days.forEach(function(day){
        total += day.count;
        var d = new Date(day.date + 'T00:00:00');
        var dateStr = d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
        html += '<i class="gh-cell lv' + level(day.count) + '" title="' + dateStr + '：' + day.count + ' 次贡献"></i>';
      });

      heat.innerHTML = html;
      totalEl.textContent = '近 1 年 ' + total + ' 次';
      widget.hidden = false; // 数据就绪，展示区块

      // 数据面板：年度贡献 + 今日贡献
      var statContrib = document.getElementById('statContrib');
      if (statContrib) statContrib.textContent = total;
      var statToday = document.getElementById('statToday');
      if (statToday){
        var today = new Date();
        var todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
        var todayCount = days.filter(function(day){ return day.date === todayStr; })[0];
        statToday.textContent = todayCount ? todayCount.count : 0;
      }
    })
    .catch(function(){ /* 网络不佳或服务不可用：整个卡片不展示 */ });
})();

/* ============ 本地时钟：纯前端实时驱动 ============ */
(function(){
  var timeEl = document.getElementById('clockTime');
  var dateEl = document.getElementById('clockDate');
  if (!timeEl || !dateEl) return;

  var WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
  function pad(n){ return String(n).padStart(2, '0'); }

  function tick(){
    var d = new Date();
    timeEl.textContent = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    dateEl.textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + WEEK[d.getDay()];
  }
  tick();
  setInterval(tick, 1000);
})();

/* ============ 数据面板：公开仓库 / 累计 Star（GitHub API）+ 运行时长 ============ */
(function(){
  // 公开仓库数与 Star 合计：与项目列表共用同一 API（各自独立容错）
  fetch('https://api.github.com/users/kamisangk')
    .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .then(function(user){
      var repos = document.getElementById('statRepos');
      if (repos) repos.textContent = user.public_repos;
      return fetch('https://api.github.com/users/kamisangk/repos?per_page=100');
    })
    .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .then(function(list){
      var stars = list.reduce(function(sum, repo){ return sum + repo.stargazers_count; }, 0);
      var el = document.getElementById('statStars');
      if (el) el.textContent = stars;
    })
    .catch(function(){ /* 拉取失败：保持 "--" 占位 */ });
})();

/* ============ 正在播放：网易云歌单（Meting API 拉取 + Audio 实际播放） ============ */
(function(){
  var widget = document.getElementById('musicWidget');
  var titleEl = document.getElementById('musicTitle');
  var artistEl = document.getElementById('musicArtist');
  var playBtn = document.getElementById('musicPlay');
  var fillEl = document.getElementById('musicFill');
  var coverEl = document.getElementById('musicCover');
  var barEl = document.getElementById('musicBar');
  if (!widget || !titleEl || !playBtn || !window.fetch) return;

  var tracks = [];          // 曲目列表（含音频流地址）
  var i = 0;                // 当前曲目下标
  var audio = null;         // Audio 实例
  var playing = false;
  var rotateTimer = null;   // 未播放时的文字轮播定时器
  var failCount = 0;        // 连续播放失败计数（防止死循环跳曲）
  var dragging = false;     // 进度条是否正在拖动

  // ===== 进度条：可点击 / 可拖动跳转 =====
  if (barEl && fillEl){
    function ratioOf(e){
      var rect = barEl.getBoundingClientRect();
      return Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    }
    barEl.addEventListener('pointerdown', function(e){
      if (!audio || !isFinite(audio.duration)) return; // 还没开始播放，不可拖
      dragging = true;
      barEl.classList.add('dragging');
      barEl.setPointerCapture(e.pointerId); // 捕获指针，移出条外也能继续拖
      fillEl.style.width = (ratioOf(e) * 100) + '%';
      e.preventDefault();
    });
    barEl.addEventListener('pointermove', function(e){
      if (!dragging) return;
      fillEl.style.width = (ratioOf(e) * 100) + '%';
    });
    function commitDrag(e){
      if (!dragging) return;
      var r = ratioOf(e);
      if (audio && isFinite(audio.duration)) audio.currentTime = r * audio.duration;
      dragging = false;
      barEl.classList.remove('dragging');
    }
    barEl.addEventListener('pointerup', commitDrag);
    barEl.addEventListener('pointercancel', commitDrag);
  }

  function render(){
    var t = tracks[i % tracks.length];
    titleEl.textContent = t.name;
    artistEl.textContent = t.artist;
    // 悬停提示显示完整曲名 / 作者（卡片内文字被省略号截断时的补充）
    titleEl.title = t.name;
    artistEl.title = t.artist;
    if (coverEl && t.pic && coverEl.src !== t.pic) coverEl.src = t.pic; // 封面跟随曲目
    titleEl.classList.remove('flip');
    void titleEl.offsetWidth; // 重置动画
    titleEl.classList.add('flip');
  }

  function updateBtn(){
    playBtn.textContent = playing ? '❚❚' : '▶';
    playBtn.title = playing ? '暂停' : '点击播放 ♪';
    widget.classList.toggle('playing', playing);
  }

  function stopRotation(){ if (rotateTimer){ clearInterval(rotateTimer); rotateTimer = null; } }
  function startRotation(){
    stopRotation();
    rotateTimer = setInterval(function(){ i++; render(); }, 12000);
  }

  // 播放当前曲目
  function playCurrent(){
    var t = tracks[i % tracks.length];
    if (audio){ audio.pause(); audio.onended = null; audio.ontimeupdate = null; audio.onerror = null; }
    audio = new Audio(t.url);
    audio.onended = function(){ failCount = 0; next(); };              // 播完自动切下一首
    audio.ontimeupdate = function(){                                   // 进度条实时走动（拖动中不回写）
      if (dragging) return;
      if (audio.duration) fillEl.style.width = (audio.currentTime / audio.duration * 100) + '%';
    };
    audio.onerror = function(){                                        // 链接失效（版权/VIP）：自动跳下一首
      if (++failCount < 5){ next(); } else { playing = false; updateBtn(); }
    };
    audio.play().catch(function(){ playing = false; updateBtn(); });
    playing = true;
    updateBtn();
  }

  function next(){
    fillEl.style.width = '0';
    i++;
    render();
    playCurrent();
  }

  // 播放/暂停按钮
  playBtn.addEventListener('click', function(e){
    e.preventDefault();
    e.stopPropagation();
    if (!tracks.length) return;
    if (playing){
      audio.pause();
      playing = false;
      updateBtn();
      startRotation(); // 暂停后恢复文字轮播
    } else {
      stopRotation();  // 播放时以真实曲目进度为准，停掉轮播
      playCurrent();
    }
  });

  fetch('https://api.injahow.cn/meting/?server=netease&type=playlist&id=93839563')
    .then(function(r){ if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .then(function(list){
      if (!list.length) throw new Error('empty');
      tracks = list;
      i = Math.floor(Math.random() * tracks.length); // 随机起点
      render();
      startRotation();
    })
    .catch(function(){
      titleEl.textContent = '东方同人歌单 ♪';
      artistEl.textContent = '网易云音乐 — 曲目召唤失败';
    });
})();
</script>
